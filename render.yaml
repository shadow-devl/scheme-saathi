services:
  - type: web
    name: scheme-saathi-backend
    plan: free
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx prisma db seed
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
